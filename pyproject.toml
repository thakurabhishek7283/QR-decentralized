[project]
name = "sigil"
version = "0.1.0"
description = "Counterfeit detection with cryptographic seals, copy-detection computer vision, a transparency log, and an auditable AI investigator."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abhishek Thakur" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "rich>=13.9",
    "segno>=1.6",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
train = ["torch>=2.5", "onnx>=1.17", "onnxscript>=0.1", "scikit-learn>=1.5"]

[project.scripts]
sigil = "sigil.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigil"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "training"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["slow: long-running tests (simulation-heavy)"]

[tool.mypy]
python_version = "3.12"
files = ["src/sigil"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sigil.harness.*", "sigil.crypto.*", "sigil.ledger.*"]
strict = true
